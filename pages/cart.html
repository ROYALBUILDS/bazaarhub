<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BazaarHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .cart-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .cart-items {
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 2rem;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .cart-empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #E0E0E0;
            gap: 1.5rem;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-image {
            font-size: 3rem;
            min-width: 80px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #004E89;
        }

        .item-price {
            color: #FF6B35;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            background: #F8F9FA;
            border: 1px solid #E0E0E0;
            width: 30px;
            height: 30px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .quantity-btn:hover {
            background: #E0E0E0;
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            border: 1px solid #E0E0E0;
            padding: 0.3rem;
            border-radius: 3px;
        }

        .remove-btn {
            background: #DC2626;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #B91C1C;
        }

        .cart-summary {
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .summary-row.total {
            border-top: 2px solid #E0E0E0;
            padding-top: 1rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: #FF6B35;
        }

        .checkout-btn {
            width: 100%;
            background: #FF6B35;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1.5rem;
        }

        .checkout-btn:hover {
            background: #E55A1F;
        }

        .checkout-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
        }

        .continue-shopping {
            text-align: center;
            margin-top: 1rem;
        }

        .continue-shopping a {
            color: #004E89;
            text-decoration: none;
            font-weight: 600;
        }

        .continue-shopping a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-controls {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>🛍️ BazaarHub</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="../index.html#products" class="nav-link">Products</a></li>
                <li><a href="../index.html#about" class="nav-link">About</a></li>
                <li><a href="../index.html#contact" class="nav-link">Contact</a></li>
                <li><a href="login.html" class="nav-link">Login</a></li>
                <li><a href="cart.html" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </div>
    </nav>

    <!-- Cart Section -->
    <div class="cart-container">
        <h2 style="margin-bottom: 2rem; color: #004E89;">Shopping Cart</h2>

        <div class="cart-content">
            <!-- Cart Items -->
            <div class="cart-items">
                <div id="cartItemsContainer">
                    <!-- Items will be loaded here -->
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <h3 style="margin-bottom: 1.5rem; color: #004E89;">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span>₹<span id="subtotal">0</span></span>
                </div>
                <div class="summary-row">
                    <span>Shipping:</span>
                    <span id="shipping">Free</span>
                </div>
                <div class="summary-row">
                    <span>Tax (5%):</span>
                    <span>₹<span id="tax">0</span></span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span>₹<span id="total">0</span></span>
                </div>

                <button class="checkout-btn" id="checkoutBtn" onclick="proceedToCheckout()">Proceed to Checkout</button>
                <div class="continue-shopping">
                    <a href="../index.html">← Continue Shopping</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 BazaarHub. All rights reserved. | Powered by ROYALBUILDS</p>
    </footer>

    <script src="../js/cart.js"></script>
    <script>
        // Display cart items
        function displayCartItems() {
            const cart = getCart();
            const container = document.getElementById('cartItemsContainer');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Add some products to get started!</p>
                    </div>
                `;
                document.getElementById('checkoutBtn').disabled = true;
                updateOrderSummary();
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="item-image">${item.image}</div>
                    <div class="item-details">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₹${item.price}</div>
                    </div>
                    <div class="item-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
                        <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        <button class="remove-btn" onclick="removeFromCart(${item.id}); displayCartItems();">Remove</button>
                    </div>
                </div>
            `).join('');

            updateOrderSummary();
        }

        // Update order summary
        function updateOrderSummary() {
            const total = getCartTotal();
            const tax = Math.round(total * 0.05);
            const grandTotal = total + tax;

            document.getElementById('subtotal').textContent = total;
            document.getElementById('tax').textContent = tax;
            document.getElementById('total').textContent = grandTotal;
        }

        // Proceed to checkout
        function proceedToCheckout() {
            if (getCart().length === 0) {
                alert('Your cart is empty!');
                return;
            }
            window.location.href = 'checkout.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            displayCartItems();
            updateCartCount();
        });
    </script>
</body>
</html>
